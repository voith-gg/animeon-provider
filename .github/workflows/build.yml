name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Setup JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build Plugins
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson
          ./gradlew ensureJarCompatibility
          cp **/build/*.cs3 . 2>/dev/null || true
          cp **/build/*.jar . 2>/dev/null || true
          cp build/plugins.json . 2>/dev/null || true

      - name: Push builds
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git checkout -B builds
          rm -rf ./*
          cp ../*.cs3 . 2>/dev/null || true
          cp ../*.jar . 2>/dev/null || true
          cp ../plugins.json . 2>/dev/null || true
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force
